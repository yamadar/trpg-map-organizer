# TRPG マップ自動タグ付けシステム 設定例
# このファイルを `config.yaml` にコピーして編集する

# 解析対象の画像が置かれているフォルダ（絶対パス推奨）
target_folder: "~/Pictures/TRPG_Maps"

# 解析対象の拡張子（小文字で比較）
image_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".webp"
  - ".gif"
  - ".bmp"

# SQLite データベースの保存先
database_path: "./data/maps.db"

# 使用する Gemini モデル
# - gemini-2.5-flash : コストと精度のバランス（推奨）
# - gemini-2.5-pro   : より高精度（コスト高）
gemini_model: "gemini-2.5-flash"

# API リクエスト時のリトライ回数 (429/503 など)
api_retries: 6

# API 呼び出し間の最小待機秒数（レート制限対策）
# Gemini 2.5 Flash の無料枠は 5 RPM 制限のため、15 秒 (= 4 RPM) を推奨。
# 有料プラン (Tier 1+) なら 0.5 程度まで縮めて高速化できる。
api_min_interval_sec: 15

# UI のグリッド列数
ui_grid_columns: 4

# サムネイル最大幅(px)
ui_thumbnail_width: 300
