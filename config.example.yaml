# TRPG マップ自動タグ付けシステム 設定例
# このファイルを `config.yaml` にコピーして編集する

# 解析対象の画像が置かれているフォルダ（絶対パス推奨）
target_folder: "~/Pictures/TRPG_Maps"

# 解析対象の拡張子（小文字で比較）
image_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".webp"
  - ".gif"
  - ".bmp"

# SQLite データベースの保存先
database_path: "./data/maps.db"

# 使用する Gemini モデル
# - gemini-2.5-flash : コストと精度のバランス（推奨）
# - gemini-2.5-pro   : より高精度（コスト高）
gemini_model: "gemini-2.5-flash"

# API リクエスト時のリトライ回数 (429/503 など)
api_retries: 6

# API 呼び出し間の最小待機秒数 (workers=1 時のみ有効)
# Gemini 2.5 Flash 無料枠 (5 RPM) は 15 秒推奨。有料 (Tier 1+) は 0 で OK。
api_min_interval_sec: 15

# 並列リクエスト数。有料プランで高速化したい場合に増やす。
# 無料枠: 1 を強く推奨 (5 RPM 制限)。
# 有料 Tier 1 (1000 RPM): 10-20 が実用的。
api_workers: 1

# UI のグリッド列数
ui_grid_columns: 4

# サムネイル最大幅(px)
ui_thumbnail_width: 300
