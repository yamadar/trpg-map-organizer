# タグ表記揺れ正規化辞書
#
# variant: canonical の形式で、左側のタグが現れたら右側に置き換える。
# - チェーン可 (大樹木: 樹木 → 樹木: 木 と書けば「大樹木」も最終的に「木」になる)
# - 全カテゴリ共通の単一辞書
# - canonical 側を更に variant に登録しないこと (循環は最大深度で打ち切るが推奨しない)
#
# 編集後の反映:
#   1. python -m scripts.normalize_db --dry-run  # 影響範囲を確認
#   2. python -m scripts.normalize_db            # 実際に DB を更新
#
# 自動提案:
#   python -m scripts.suggest_aliases
#     → tag_aliases_suggested.yaml に Gemini からの提案が出るので
#       内容を確認して tag_aliases.yaml にマージする

aliases:
  # =====================================================================
  # 地形・自然要素
  # =====================================================================

  # 「木」に統合
  大木: 木
  樹木: 木
  巨木: 木
  木々: 木
  倒木: 木
  枯れ木: 木
  ヤシの木: 木
  椰子の木: 木
  針葉樹: 木

  # 「森」に統合
  森林: 森
  樹林: 森
  針葉樹林: 森

  # 「川」に統合
  河川: 川
  小川: 川

  # 「海」に統合
  海洋: 海

  # 「山」に統合
  山岳: 山

  # 「平地」に統合
  平野: 平地
  平原: 平地

  # 「草原」に統合
  草地: 草原
  牧草地: 草原

  # 「草」に統合
  茂み: 草
  草木: 草

  # 「道」に統合
  小道: 道
  街路: 道
  街道: 道
  路地: 道
  舗装路: 道
  土道: 道
  木道: 道

  # 「畑」に統合
  花畑: 畑
  麦畑: 畑
  ぶどう畑: 畑

  # 「結晶」に統合
  水晶: 結晶
  クリスタル: 結晶

  # 「荒地」に統合
  荒れ地: 荒地

  # 「浮島」に統合
  浮遊島: 浮島
  空中島: 浮島

  # =====================================================================
  # 雰囲気・印象
  # =====================================================================

  # 接尾辞「な/的/風/り/ある/しい」を取り除く
  のどかな: のどか
  平和な: 平和
  快適な: 快適
  活気ある: 活気
  寒々しい: 寒い
  中世風: 中世
  魔法的: 魔法
  冒険的: 冒険

  # 完全同義語
  静謐: 静寂

  # =====================================================================
  # 場所・空間
  # =====================================================================

  # 「町」に統合
  街並み: 町
  街中: 町
  市街: 町
  中心街: 町

  # 「村」に統合
  農村: 村
  村外れ: 村

  # 「森」に統合 (place として)
  林: 森
  森の中: 森
  魔法の森: 森

  # 「家」に統合
  民家: 家
  家屋: 家

  # 「邸宅」に統合
  屋敷: 邸宅
  豪邸: 邸宅
  館: 邸宅

  # 「廃墟」に統合
  廃屋: 廃墟
  廃都: 廃墟

  # 「教会」に統合
  礼拝堂: 教会
  聖堂: 教会
  大聖堂: 教会

  # 「墓地」に統合
  墓所: 墓地
  霊園: 墓地
  霊廟: 墓地
  納骨堂: 墓地

  # 「牢屋」に統合
