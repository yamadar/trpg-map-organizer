<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG Map Organizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title" data-i18n="title">TRPG Map Organizer</h1>
    <span id="count" class="count">—</span>
    <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="sidebar">
      <span class="filter-icon" aria-hidden="true">🔍</span>
      <span class="filter-label" data-i18n="filters">フィルタ</span>
      <span class="filter-badge" id="filter-badge">0</span>
    </button>
    <button type="button" id="lang-toggle" class="lang-toggle" data-i18n-attr="title:lang_label,aria-label:lang_label" title="言語" aria-label="言語">
      <span class="lang-icon" aria-hidden="true">🌐</span>
      <span class="lang-code" id="lang-code">JA</span>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <section class="filter">
        <label class="filter-label" for="search" data-i18n="search_label">ファイル名検索</label>
        <input type="search" id="search" autocomplete="off" data-i18n-attr="placeholder:search_placeholder" placeholder="部分一致...">
      </section>

      <section class="filter">
        <label class="filter-label" for="match-mode" data-i18n="match_label">タグ一致条件</label>
        <select id="match-mode">
          <option value="any" data-i18n="match_any">いずれか含む (OR)</option>
          <option value="all" data-i18n="match_all">全て含む (AND)</option>
        </select>
      </section>

      <nav class="cat-tabs" role="tablist" aria-label="filter category">
        <button type="button" role="tab" class="cat-tab active" data-cat="theme" aria-selected="true" aria-controls="theme">
          <span data-i18n="theme">テーマ</span>
          <span class="tab-badge" id="theme-tab-badge">0</span>
        </button>
        <button type="button" role="tab" class="cat-tab" data-cat="terrain" aria-selected="false" aria-controls="terrain">
          <span data-i18n="terrain">地形</span>
          <span class="tab-badge" id="terrain-tab-badge">0</span>
        </button>
        <button type="button" role="tab" class="cat-tab" data-cat="mood" aria-selected="false" aria-controls="mood">
          <span data-i18n="mood">雰囲気</span>
          <span class="tab-badge" id="mood-tab-badge">0</span>
        </button>
        <button type="button" role="tab" class="cat-tab" data-cat="location" aria-selected="false" aria-controls="location">
          <span data-i18n="location">場所</span>
          <span class="tab-badge" id="location-tab-badge">0</span>
        </button>
      </nav>

      <details class="cat" data-cat="theme" data-active open>
        <summary><span data-i18n="theme">テーマ</span> <span class="badge" id="theme-selected">0</span></summary>
        <div class="chips" id="theme"></div>
      </details>

      <details class="cat" data-cat="terrain" open>
        <summary><span data-i18n="terrain">地形</span> <span class="badge" id="terrain-selected">0</span></summary>
        <div class="chips" id="terrain"></div>
      </details>

      <details class="cat" data-cat="mood" open>
        <summary><span data-i18n="mood">雰囲気</span> <span class="badge" id="mood-selected">0</span></summary>
        <div class="chips" id="mood"></div>
      </details>

      <details class="cat" data-cat="location" open>
        <summary><span data-i18n="location">場所</span> <span class="badge" id="location-selected">0</span></summary>
        <div class="chips" id="location"></div>
      </details>

      <button id="clear" type="button" class="clear-btn" data-i18n="clear">フィルタをクリア</button>

      <footer class="sidebar-footer">
        <small id="generated-at">—</small>
      </footer>
    </aside>

    <main class="grid" id="grid">
      <p class="loading" data-i18n="loading">読み込み中...</p>
    </main>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden>
  </div>

  <dialog id="preview" class="preview">
    <div class="preview-toolbar">
      <button type="button" class="nav-btn" id="prev-btn" data-i18n-attr="title:preview_prev,aria-label:preview_prev" title="前へ" aria-label="前へ">‹</button>
      <span class="position" id="position">— / —</span>
      <button type="button" class="nav-btn" id="next-btn" data-i18n-attr="title:preview_next,aria-label:preview_next" title="次へ" aria-label="次へ">›</button>
      <span class="toolbar-spacer"></span>
      <button type="button" class="close" id="close" data-i18n-attr="title:preview_close,aria-label:preview_close" title="閉じる" aria-label="閉じる">×</button>
    </div>
    <div class="preview-body">
      <div class="preview-image-wrap" id="image-wrap">
        <img id="preview-img" alt="">
      </div>
      <div class="preview-info">
        <h2 id="preview-title"></h2>
        <p class="preview-desc" id="preview-desc"></p>

        <div class="actions">
          <a id="download-original" class="btn btn-primary" download data-i18n="download_original">元画像をダウンロード</a>
          <a id="download-jpeg" class="btn" download data-i18n="download_jpeg">JPEG をダウンロード (1280px)</a>
          <button id="copy-url" type="button" class="btn" data-i18n="copy_url">URL をコピー</button>
          <span id="toast" class="toast" hidden></span>
        </div>

        <section class="preview-tags">
          <h4 data-i18n="theme">テーマ</h4>
          <div id="preview-theme"></div>
        </section>
        <section class="preview-tags">
          <h4 data-i18n="terrain">地形</h4>
          <div id="preview-terrain"></div>
        </section>
        <section class="preview-tags">
          <h4 data-i18n="mood">雰囲気</h4>
          <div id="preview-mood"></div>
        </section>
        <section class="preview-tags">
          <h4 data-i18n="location">場所</h4>
          <div id="preview-location"></div>
        </section>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
